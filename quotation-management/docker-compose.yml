services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexzibyte_quotations
      POSTGRES_USER: quotation_user
      POSTGRES_PASSWORD: change-this-local-password
    ports: ["5432:5432"]
    volumes: ["quotation_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation_user -d nexzibyte_quotations"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://quotation_user:change-this-local-password@postgres:5432/nexzibyte_quotations?schema=public
      FRONTEND_URL: http://localhost:8080
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - quotation_documents:/app/storage
      - quotation_backups:/app/backups
    ports: ["4000:4000"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on: [backend]
    ports: ["8080:80"]
    restart: unless-stopped
volumes:
  quotation_pgdata:
  quotation_documents:
  quotation_backups:
