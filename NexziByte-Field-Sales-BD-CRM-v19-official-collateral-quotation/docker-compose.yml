services:
  db:
    image: postgres:16
    container_name: nexzibyte-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: nexzibyte_crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
volumes:
  crm_pgdata:
